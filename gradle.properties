android.useAndroidX=true
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m
org.gradle.daemon=false
org.gradle.parallel=false
kotlin.compiler.execution.strategy=in-process
# NOTE: android.aapt2FromMavenOverride is deliberately NOT set here.
# It needs an absolute path to a native aapt2, which is host-specific
# (Termux: /data/data/com.termux/files/usr/bin/aapt2). scripts/build-gradle.sh
# detects the environment and passes it with -P instead.
