name: stage20-validation
# Stage-20 CI gate (validation only): JVM tests, dependency resolution,
# NDK/JNI symbols, APK assembly + security inspection. No release,
# no deploys. Runs on the stage20-validation branch and on demand.
on:
  push:
    branches: [stage20-validation]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Host unit tests
        env:
          CXX: g++
          XYKELL_WORK: /tmp/xykell-unit
        run: bash scripts/test/run-unit.sh

      - name: Lab WebSocket tests
        run: |
          set -e
          cd lab/bedrock-websocket
          npm test

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Use preinstalled Android SDK
        run: |
          set -e
          test -n "$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1"
          echo "SDK=$ANDROID_HOME"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" version

      - name: Set up NDK r28c
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Dependency resolution (OkHttp tree)
        run: |
          set -e
          gradle :app:dependencies --configuration debugRuntimeClasspath > /tmp/deps.txt
          grep -E "com.squareup.okhttp3:okhttp" /tmp/deps.txt
          grep -E "com.squareup.okio:okio" /tmp/deps.txt
          grep -E "org.jetbrains.kotlin:kotlin-stdlib" /tmp/deps.txt | head -n 3
          grep -E "org.json:json" /tmp/deps.txt || true
          echo "--- gradle/java versions ---"
          gradle --version | grep -E "Gradle|JVM:"
          echo "$ANDROID_NDK_HOME" | grep -o "r28c" || echo "$ANDROID_NDK_HOME"

      - name: JVM unit tests (Stage-20 pipeline)
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Summarize JVM test results
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          total = fail = err = skip = 0
          for f in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r = ET.parse(f).getroot()
              total += int(r.get('tests', 0)); fail += int(r.get('failures', 0))
              err += int(r.get('errors', 0)); skip += int(r.get('skipped', 0))
          print(f"JVM-TESTS total={total} failures={fail} errors={err} skipped={skip}")
          assert fail == 0 and err == 0 and total > 0, "JVM gate failed"
          EOF

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Inspect APK (Stage-20 security surface)
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          echo "APK size: $(stat -c%s "$APK")"
          echo "--- permissions (must be exactly the 3 approved) ---"
          "$AAPT" dump permissions "$APK"
          PERMS=$("$AAPT" dump permissions "$APK" | grep -c "permission:")
          echo "permission-count=$PERMS"
          "$AAPT" dump badging "$APK" | grep -E "package:|launchable-activity|uses-permission" | head -n 12
          echo "--- manifest services/receivers (exactly 1 service, 0 receivers) ---"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/manifest-tree.txt
          grep -c "E: service" /tmp/manifest-tree.txt
          grep -E "E: (service|receiver|provider)" /tmp/manifest-tree.txt
          grep -q "BOOT_COMPLETED" /tmp/manifest-tree.txt && (echo "BOOT RECEIVER PRESENT" && exit 1) || echo "no-boot-receiver"
          grep -A3 "E: service" /tmp/manifest-tree.txt | grep -E "specialUse|exported" | head -n 4
          echo "--- endpoint strings in dex (only 127.0.0.1:8765 allowed) ---"
          rm -rf /tmp/dexcheck && mkdir -p /tmp/dexcheck && cd /tmp/dexcheck
          unzip -o "$GITHUB_WORKSPACE/$APK" 'classes*.dex' > /dev/null
          strings classes*.dex | grep -E "ws://|wss://|http://" | sort | uniq -c | sort -rn | head -n 20
          if strings classes*.dex | grep -E "ws://|wss://" | grep -v "ws://127.0.0.1:8765" | grep -q .; then
            echo "UNEXPECTED WEBSOCKET ENDPOINT" && exit 1
          fi
          echo "endpoint-check: only ws://127.0.0.1:8765"
          strings classes*.dex | grep -c -i -E "/execute|BOOT_COMPLETED" || echo "no-exec-no-boot-strings"
          echo "--- native lib + JNI offer symbols ---"
          unzip -l "$GITHUB_WORKSPACE/$APK" | grep -q "lib/arm64-v8a/libxykellcore.so"
          unzip -o "$GITHUB_WORKSPACE/$APK" lib/arm64-v8a/libxykellcore.so > /dev/null
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$NM" -D lib/arm64-v8a/libxykellcore.so | grep -c "Observations_nativeOffer"
          "$NM" -D lib/arm64-v8a/libxykellcore.so | grep "Observations_nativeOffer"

      - name: Upload validation APK
        uses: actions/upload-artifact@v4
        with:
          name: XykellStage20-validation
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
