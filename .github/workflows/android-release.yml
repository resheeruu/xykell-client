name: android-release
# M1.5: phone is ARM64 (stock aapt2 is x86-64), so APK assembly runs here.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          set -e
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up NDK r28c
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c

      - name: Build native lib (arm64-v8a)
        run: |
          set -e
          test -n "$ANDROID_NDK_HOME"
          cmake -S native -B build/ci-native -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28
          cmake --build build/ci-native
          SO=build/ci-native/libxykell.so
          file "$SO"
          file "$SO" | grep -q "ARM aarch64"
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$NM" -D "$SO" | grep -q "T PLGetModRegistration"
          ls -la "$SO"

      - name: Stage native lib into app
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp build/ci-native/libxykell.so app/src/main/jniLibs/arm64-v8a/libxykell.so
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep "lib/arm64-v8a/libxykell.so"
          mkdir -p /tmp/apkcheck && cd /tmp/apkcheck
          unzip -o "$GITHUB_WORKSPACE/$APK" lib/arm64-v8a/libxykell.so
          file lib/arm64-v8a/libxykell.so | grep -q "ARM aarch64"
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$NM" -D lib/arm64-v8a/libxykell.so | grep -q "T PLGetModRegistration"
          echo "APK_SIZE=$(stat -c%s "$GITHUB_WORKSPACE/$APK")"
          sha256sum "$GITHUB_WORKSPACE/$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: XykellClient-debug
          path: app/build/outputs/apk/debug/app-debug.apk
